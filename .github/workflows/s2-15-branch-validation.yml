name: S2.15 Branch Validation

on:
  push:
    branches:
      - sprint/s2-15-mechanical-assembly-constraints

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npm run verify:af001l:contract
      - run: npm run verify:s1.12
      - run: npm run verify:s2.1
      - run: npm run verify:s2.2
      - run: npm run verify:s2.3
      - run: npm run verify:s2.4
      - run: npm run verify:s2.5
      - run: npm run verify:s2.6
      - run: npm run verify:s2.7
      - run: npm run verify:s2.8
      - run: npm run verify:s2.9
      - run: npm run verify:s2.10
      - run: npm run verify:s2.11
      - run: npm run verify:s2.12
      - run: npm run verify:s2.13
      - run: npm run verify:s2.14
      - run: npm run verify:s2.15
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/socket-aware-invention.spec.ts --config=playwright.config.ts
      - run: npx playwright test tests/browser/mechanical-assembly-invention.spec.ts --config=playwright.config.ts
      - run: npm run smoke:browser
      - name: Assert AF-001I deterministic evidence
        run: |
          test -f test-results/af001i-evidence/af001i-three-quarter.png
          test -f test-results/af001i-evidence/af001i-front.png
          test -f test-results/af001i-evidence/af001i-side.png
          test -f test-results/af001i-evidence/af001i-rear.png
          test -f test-results/af001i-evidence/af001i-bearing.png
          test -f test-results/af001i-evidence/af001i-terminals.png
          test -f test-results/af001i-evidence/af001i-runtime-context.json
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s2-15-branch-validation-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
