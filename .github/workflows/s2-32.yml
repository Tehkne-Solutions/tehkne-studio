name: S2.32 Rotary Waypoint Sequence Execution Evidence Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  execution-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm run security:audit
      - name: Core typecheck
        run: npm run typecheck:core
      - name: Domain regression
        run: npm run test:domain
      - name: S2.31 predecessor contract
        run: npm run verify:s2.31
      - name: S2.32 rotary waypoint execution evidence contract
        run: npm run verify:s2.32
      - name: Preserve S2.32 failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s2-32-browser-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
