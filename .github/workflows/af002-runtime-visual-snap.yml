name: AF-002 Runtime Visual Snap Gate

on:
  pull_request:
    paths:
      - "library/components/extensions/asset-forge-af002-v1.json"
      - "apps/studio-web/components/Af002RuntimeVisualReview.tsx"
      - "apps/studio-web/app/asset-forge/af002/**"
      - "scripts/verify-af002-runtime-visual-snap.mjs"
      - ".github/workflows/af002-runtime-visual-snap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-af002-runtime-visual-snap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Verify AF-002 runtime visual + socket bridge
        run: node scripts/verify-af002-runtime-visual-snap.mjs
      - name: Build Studio web
        run: npm run build:web
