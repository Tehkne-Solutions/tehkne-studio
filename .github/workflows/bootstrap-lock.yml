name: S2.1 Lock Bootstrap

on:
  push:
    branches:
      - feat/s2-01-alpha-hardening-security

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/s2-01-alpha-hardening-security
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git commit -m "S2.1 lock dependency graph"
          git push origin HEAD:feat/s2-01-alpha-hardening-security
