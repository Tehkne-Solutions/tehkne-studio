name: S2.8 Registry Integration Bootstrap

on:
  push:
    branches: [feat/s2-08-technology-preset-registry]
    paths:
      - .github/workflows/s2-08-registry-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/s2-08-technology-preset-registry
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Apply fail-closed registry transformation
        run: node tools/s2-08-integrate-preset-registry.mjs
      - name: Validate generated diff
        run: |
          git diff --check
          grep -q 'TechnologyPresetLauncher' apps/studio-web/components/SpatialWorkbench.tsx
          grep -q 'technologyPresetRegistry.resolveUtterance' apps/studio-web/components/SpatialWorkbench.tsx
          grep -q 'technologyPresetRegistry.getByAdapter' apps/studio-web/components/SpatialWorkbench.tsx
          if grep -q 'const looksNotebook' apps/studio-web/components/SpatialWorkbench.tsx; then exit 1; fi
      - name: Commit registry-driven Workbench integration
        run: |
          if git diff --quiet -- apps/studio-web/components/SpatialWorkbench.tsx; then
            echo 'Expected registry transformation produced no diff' >&2
            exit 1
          fi
          git config user.name 'Tehkné Solutions Automation'
          git config user.email 'automation@tehkne.solutions'
          git add apps/studio-web/components/SpatialWorkbench.tsx
          git commit -m 'S2.8 drive First Workbench from Technology Preset Registry'
          git push origin HEAD:feat/s2-08-technology-preset-registry
