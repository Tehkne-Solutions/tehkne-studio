name: S2.6 Tablet Technology Preset Gate

on:
  pull_request:
  push:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  tablet-preset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: AF-001I synthesize Three typings lock
        run: npm install --package-lock-only --ignore-scripts --workspace @tehkne/studio-web --save-dev @types/three@0.170.0
      - name: Preserve synthesized dependency files
        uses: actions/upload-artifact@v7
        with:
          name: af001i-three-types-lock-${{ github.sha }}
          path: |
            apps/studio-web/package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7
      - run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm run security:audit
      - name: Alpha 01 regression gate
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          npm run verify:s1.12 2>&1 | tee .ci-evidence/alpha01-regression.log
      - name: Preserve Alpha regression diagnostic
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: af001i-alpha-diagnostic-${{ github.sha }}
          path: .ci-evidence/alpha01-regression.log
          if-no-files-found: error
          retention-days: 7
      - name: S2.1 hardening contract
        run: npm run verify:s2.1
      - name: S2.2 persistence contract
        run: npm run verify:s2.2
      - name: S2.3 component library contract
        run: npm run verify:s2.3
      - name: S2.4 smartphone product contract
        run: npm run verify:s2.4
      - name: S2.5 notebook product contract
        run: npm run verify:s2.5
      - name: S2.6 tablet product contract
        run: npm run verify:s2.6
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Alpha and platform browser smoke
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          npm run smoke:browser 2>&1 | tee .ci-evidence/browser-smoke.log
      - name: Assert AF-001I deterministic evidence
        run: |
          test -f test-results/af001i-evidence/af001i-three-quarter.png
          test -f test-results/af001i-evidence/af001i-front.png
          test -f test-results/af001i-evidence/af001i-side.png
          test -f test-results/af001i-evidence/af001i-rear.png
          test -f test-results/af001i-evidence/af001i-bearing.png
          test -f test-results/af001i-evidence/af001i-terminals.png
          test -f test-results/af001i-evidence/af001i-runtime-context.json
      - name: Preserve browser smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-log-${{ github.sha }}
          path: .ci-evidence/browser-smoke.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve AF-001I browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: af001i-browser-evidence-${{ github.sha }}
          path: test-results/af001i-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s2-06-browser-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
