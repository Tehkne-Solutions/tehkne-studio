name: S1 Engineering Core UX Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engineering-core-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run verify:s1.3
