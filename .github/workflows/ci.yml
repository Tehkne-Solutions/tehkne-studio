name: S2.24 Multi-turn Rotary Kinematics Gate

on:
  pull_request:
  push:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  circuit-creation-measurement:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm run security:audit
      - name: Alpha 01 regression gate
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          npm run verify:s1.12 2>&1 | tee .ci-evidence/alpha01-regression.log
      - name: Preserve Alpha regression diagnostic
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: af001i-alpha-diagnostic-${{ github.sha }}
          path: .ci-evidence/alpha01-regression.log
          if-no-files-found: error
          retention-days: 7
      - name: S2.1 hardening contract
        run: npm run verify:s2.1
      - name: S2.2 persistence contract
        run: npm run verify:s2.2
      - name: S2.3 component library contract
        run: npm run verify:s2.3
      - name: S2.4 smartphone product contract
        run: npm run verify:s2.4
      - name: S2.5 notebook product contract
        run: npm run verify:s2.5
      - name: S2.6 tablet product contract
        run: npm run verify:s2.6
      - name: S2.7 display-system product contract
        run: npm run verify:s2.7
      - name: S2.8 electronics workbench contract
        run: npm run verify:s2.8
      - name: S2.9 circuit creation and measurement contract
        run: npm run verify:s2.9
      - name: S2.10 blank invention contract
        run: npm run verify:s2.10
      - name: S2.11 spatial invention contract
        run: npm run verify:s2.11
      - name: S2.12 3D invention workbench contract
        run: npm run verify:s2.12
      - name: S2.13 asset-backed invention rendering contract
        run: npm run verify:s2.13
      - name: S2.14 socket-aware invention wiring contract
        run: npm run verify:s2.14
      - name: S2.15 direct socket wiring contract
        run: npm run verify:s2.15
      - name: S2.16 mechanical assembly constraints contract
        run: npm run verify:s2.16
      - name: S2.17 rigid mechanical assembly rotation contract
        run: npm run verify:s2.17
      - name: S2.18 axial joint alignment contract
        run: npm run verify:s2.18
      - name: S2.19 rotary joint DOF contract
        run: npm run verify:s2.19
      - name: S2.20 rotary joint relative-angle contract
        run: npm run verify:s2.20
      - name: S2.21 rotary joint target-angle contract
        run: npm run verify:s2.21
      - name: S2.22 atomic spatial transform contract
        run: npm run verify:s2.22
      - name: S2.23 mechanical command runtime contract
        run: npm run verify:s2.23
      - name: S2.24 multi-turn rotary kinematics contract
        run: npm run verify:s2.24
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: S2.14 socket-aware browser contract
        run: npx playwright test tests/browser/socket-aware-invention.spec.ts --config=playwright.config.ts
      - name: S2.15 direct socket wiring browser contract
        run: npx playwright test tests/browser/direct-socket-wiring.spec.ts --config=playwright.config.ts
      - name: S2.16 mechanical assembly browser contract
        run: npx playwright test tests/browser/mechanical-assembly-invention.spec.ts --config=playwright.config.ts
      - name: S2.17 rigid assembly rotation browser contract
        run: npx playwright test tests/browser/rigid-assembly-rotation.spec.ts --config=playwright.config.ts
      - name: S2.18 axial joint alignment browser contract
        run: npx playwright test tests/browser/axial-joint-alignment.spec.ts --config=playwright.config.ts
      - name: S2.19 rotary joint DOF browser contract
        run: npx playwright test tests/browser/rotary-joint-dof.spec.ts --config=playwright.config.ts
      - name: S2.20 rotary joint relative-angle browser contract
        run: npx playwright test tests/browser/rotary-joint-relative-angle.spec.ts --config=playwright.config.ts
      - name: S2.21 rotary joint target-angle browser contract
        run: npx playwright test tests/browser/rotary-joint-target-angle.spec.ts --config=playwright.config.ts
      - name: S2.22 atomic spatial transform browser contract
        run: npx playwright test tests/browser/atomic-spatial-transform.spec.ts --config=playwright.config.ts
      - name: S2.23 mechanical CommandBus browser contract
        run: npx playwright test tests/browser/mechanical-command-runtime.spec.ts --config=playwright.config.ts
      - name: S2.24 multi-turn rotary kinematics browser contract
        run: npx playwright test tests/browser/rotary-multiturn-kinematics.spec.ts --config=playwright.config.ts
      - name: Alpha and platform browser smoke
        run: |
          set -o pipefail
          mkdir -p .ci-evidence
          npm run smoke:browser 2>&1 | tee .ci-evidence/browser-smoke.log
      - name: Assert AF-001I deterministic evidence
        run: |
          test -f test-results/af001i-evidence/af001i-three-quarter.png
          test -f test-results/af001i-evidence/af001i-front.png
          test -f test-results/af001i-evidence/af001i-side.png
          test -f test-results/af001i-evidence/af001i-rear.png
          test -f test-results/af001i-evidence/af001i-bearing.png
          test -f test-results/af001i-evidence/af001i-terminals.png
          test -f test-results/af001i-evidence/af001i-runtime-context.json
      - name: Preserve browser smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-log-${{ github.sha }}
          path: .ci-evidence/browser-smoke.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve AF-001I browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: af001i-browser-evidence-${{ github.sha }}
          path: test-results/af001i-evidence
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s2-24-browser-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
