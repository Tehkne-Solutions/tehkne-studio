name: S2.8 Technology Preset Registry Gate

on:
  pull_request:
  push:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  technology-preset-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm run security:audit
      - name: Alpha 01 regression gate
        run: npm run verify:s1.12
      - name: S2.1 hardening contract
        run: npm run verify:s2.1
      - name: S2.2 persistence contract
        run: npm run verify:s2.2
      - name: S2.3 component library contract
        run: npm run verify:s2.3
      - name: S2.4 smartphone product contract
        run: npm run verify:s2.4
      - name: S2.5 notebook product contract
        run: npm run verify:s2.5
      - name: S2.6 tablet product contract
        run: npm run verify:s2.6
      - name: S2.7 display-system product contract
        run: npm run verify:s2.7
      - name: S2.8 technology preset registry contract
        run: npm run verify:s2.8
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Alpha and platform browser smoke
        run: npm run smoke:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s2-08-browser-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
