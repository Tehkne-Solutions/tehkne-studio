name: S2.4 Smartphone Technology Preset Gate

on:
  pull_request:
  push:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  smartphone-preset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm run security:audit
      - name: Alpha 01 regression gate
        run: |
          mkdir -p .ci-evidence
          npm run verify:s1.12 2>&1 | tee .ci-evidence/alpha01-regression.log
      - name: Preserve Alpha 01 regression diagnostic
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: alpha01-regression-diagnostic-${{ github.sha }}
          path: .ci-evidence/alpha01-regression.log
          if-no-files-found: error
          retention-days: 7
      - name: S2.1 hardening contract
        run: npm run verify:s2.1
      - name: S2.2 persistence contract
        run: npm run verify:s2.2
      - name: S2.3 component library contract
        run: npm run verify:s2.3
      - name: S2.4 smartphone product contract
        run: |
          mkdir -p .ci-evidence
          npm run verify:s2.4 2>&1 | tee .ci-evidence/s2-4-smartphone.log
      - name: Preserve S2.4 diagnostic
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s2-4-smartphone-diagnostic-${{ github.sha }}
          path: .ci-evidence/s2-4-smartphone.log
          if-no-files-found: error
          retention-days: 7
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Alpha and platform browser smoke
        run: |
          mkdir -p .ci-evidence
          npm run smoke:browser 2>&1 | tee .ci-evidence/browser-smoke.log
      - name: Preserve browser smoke diagnostic
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-diagnostic-${{ github.sha }}
          path: .ci-evidence/browser-smoke.log
          if-no-files-found: error
          retention-days: 7
      - name: Preserve AF-001I browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: af001i-browser-evidence-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s2-01-browser-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
