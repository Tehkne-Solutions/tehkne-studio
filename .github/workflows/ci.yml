name: S2.2 Project Persistence Gate

on:
  pull_request:
  push:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  project-persistence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm run security:audit
      - name: Alpha 01 regression gate
        run: npm run verify:s1.12
      - name: S2.1 hardening contract
        run: npm run verify:s2.1
      - name: S2.2 persistence contract
        run: npm run verify:s2.2
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Alpha and persistence browser smoke
        run: npm run smoke:browser
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s2-01-browser-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
