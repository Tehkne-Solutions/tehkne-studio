name: AF-002 Browser Evidence Gate

on:
  pull_request:
    paths:
      - "apps/studio-web/app/asset-forge/af002/**"
      - "apps/studio-web/components/Af002RuntimeVisualReview.tsx"
      - "apps/studio-web/app/api/asset-forge/af002/**"
      - "apps/studio-web/app/api/asset-forge/af001/**"
      - "tests/browser/asset-forge-af002.spec.ts"
      - ".github/workflows/af002-browser-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  af002-browser-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Studio web
        run: npm run build:web
      - name: Run AF-002 Chromium evidence
        run: npx playwright test tests/browser/asset-forge-af002.spec.ts --project=chromium
      - name: Preserve AF-002 browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: af002-browser-evidence
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 14
