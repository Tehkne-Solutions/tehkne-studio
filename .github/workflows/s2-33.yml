name: S2.33 AF-002 Dual-Shaft Assembly Gate

on:
  pull_request:
  workflow_dispatch:

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  af002-dual-shaft:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm run security:audit
      - name: Core typecheck
        run: npm run typecheck:core
      - name: Domain regression including AF-002 dual-shaft topology
        run: npm run test:domain
      - name: S2.32 predecessor contract
        run: npm run verify:s2.32
      - name: S2.33 AF-002 dual-shaft contract
        run: node scripts/verify-s2.33.mjs
      - name: Preserve S2.33 failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: s2-33-af002-dual-shaft-failure
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
